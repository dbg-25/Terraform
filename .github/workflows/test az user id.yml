name: Test Azure User Identity OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write   # Required to request the OIDC JWT token
  contents: read    # Required to checkout the repository

jobs:
  test-oidc-login:
    runs-on: ubuntu-latest
    environment: Terraform Azure
    steps:
      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Identity and Subscription
        run: |
          az account show
          az ad sp show --id "${{ vars.CLIENT_ID }}" --query "{displayName:displayName, appId:appId}" -o table || true
