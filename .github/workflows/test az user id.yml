name: Test Azure User Identity OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write   # Required to request the OIDC JWT token
  contents: read    # Required to checkout the repository

jobs:
  test-oidc-login:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          Auth-Type: IDENTITY
          client-id: ${{ vars.CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Identity and Subscription
        run: |
          az account show
          az ad signed-in-user show || echo "Authenticated via Managed Identity (no user profile)"
