name: Test Azure User Identity OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write   # Required to request the OIDC JWT token
  contents: read    # Required to checkout the repository

jobs:
  test-oidc-login:
    runs-on: ubuntu-latest
    steps:

      - name: Verify OIDC Variables Are Populated
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then echo "Error: AZURE_CLIENT_ID is empty"; exit 1; fi
          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then echo "Error: AZURE_TENANT_ID is empty"; exit 1; fi
          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then echo "Error: AZURE_SUBSCRIPTION_ID is empty"; exit 1; fi

    
      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Identity and Subscription
        run: |
          az account show
          az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query "{displayName:displayName, appId:appId}" -o table || true
