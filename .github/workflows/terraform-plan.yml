name: 'Terraform Plan'

on:
  pull_request:
    branches:
      - main

env:
    TF_CLOUD_ORGANIZATION: 'TerraformTest1290'
    tf_api_token: ${{ secrets.TF_API_TOKEN }}
    tf_workspace: 'Test-Pipeline-TF'
    CONFIG_DIRECTORY: './'

jobs:
    terraform:
        name: 'Terraform Plan'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: 'Checkout'
              uses: actions/checkout@v3

            - name: 'Setup Terraform'
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: 1.7.6

            - name: 'Terraform Init'
              run: terraform init -input=false -no-color ${{ env.CONFIG_DIRECTORY }}

            - name: 'Terraform Plan'
              run: terraform plan -input=false -no-color ${{ env.CONFIG_DIRECTORY }}